version: '3.8'

services:
  db_testing:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: clinomic_testing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_testing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinomic_network
      - testing_internal

  backend_testing:
    image: ghcr.io/dev-abiox/param:test-latest
    restart: always
    environment:
      - DEBUG=False
      - APP_ENV=testing
      - POSTGRES_HOST=db_testing
      - POSTGRES_PORT=5432
      - POSTGRES_DB=clinomic_testing
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - AUDIT_SIGNING_KEY=${AUDIT_SIGNING_KEY}
      - ALLOWED_HOSTS=testing.clinomiclabs.com,localhost
      - FRONTEND_URL=https://testing.clinomiclabs.com
      - CORS_ORIGINS=https://testing.clinomiclabs.com
      - CSRF_TRUSTED_ORIGINS=https://testing.clinomiclabs.com
      - REDIS_URL=redis://redis_testing:6379/0
      - CACHE_REDIS_URL=redis://redis_testing:6379/1
      - CHANNELS_REDIS_URL=redis://redis_testing:6379/2
      - CELERY_BROKER_URL=redis://redis_testing:6379/0
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-REDACTED_ROTATED_2026_04_15}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-REDACTED_ROTATED_2026_04_15}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - EMAIL_HOST=${EMAIL_HOST:-mail.arogyabiox.com}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      python manage.py migrate_schemas &&
      python manage.py seed_demo_data --skip-screenings &&
      python manage.py ensure_domains &&
      uvicorn clinomic.asgi:application --host 0.0.0.0 --port 8000 --workers 2
      "
    depends_on:
      db_testing:
        condition: service_healthy
    volumes:
      - static_testing_volume:/app/staticfiles
      - ./ml/models:/app/ml/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'Host: testing.clinomiclabs.com' http://localhost:8000/api/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      clinomic_network:
      testing_internal:
        aliases:
          - backend

  frontend_testing:
    image: ghcr.io/dev-abiox/param-frontend:test-latest
    restart: always
    environment:
      - REACT_APP_BACKEND_URL=http://backend:8000
    depends_on:
      - backend_testing
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - clinomic_network
      - testing_internal

  redis_testing:
    image: redis:7-alpine
    restart: always
    command: redis-server --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testing_internal

  celery_worker_testing:
    image: ghcr.io/dev-abiox/param:test-latest
    restart: always
    command: celery -A clinomic worker --loglevel=info --concurrency=1 -Q default,email,alerts,webhooks
    healthcheck:
      test: ["CMD-SHELL", "celery -A clinomic inspect ping --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    environment:
      - DEBUG=False
      - APP_ENV=testing
      - POSTGRES_HOST=db_testing
      - POSTGRES_PORT=5432
      - POSTGRES_DB=clinomic_testing
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - AUDIT_SIGNING_KEY=${AUDIT_SIGNING_KEY}
      - REDIS_URL=redis://redis_testing:6379/0
      - CACHE_REDIS_URL=redis://redis_testing:6379/1
      - CELERY_BROKER_URL=redis://redis_testing:6379/0
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-REDACTED_ROTATED_2026_04_15}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-REDACTED_ROTATED_2026_04_15}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      db_testing:
        condition: service_healthy
      redis_testing:
        condition: service_healthy
    networks:
      - testing_internal

volumes:
  postgres_testing_data:
  static_testing_volume:
    external: true

networks:
  clinomic_network:
    external: true
  testing_internal:
    driver: bridge
