name: Production Deploy

on:
  push:
    branches: [ main, master ]

env:
  BACKEND_IMAGE: ghcr.io/dev-abiox/param
  FRONTEND_IMAGE: ghcr.io/dev-abiox/param-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: clinomic_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          cd backend_v3
          pip install setuptools
          pip install -r requirements.txt
      - name: Run backend tests with coverage
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          JWT_SECRET_KEY: ci-jwt-secret-key-not-for-production
          JWT_REFRESH_SECRET_KEY: ci-jwt-refresh-secret-not-for-production
          MASTER_ENCRYPTION_KEY: ${{ secrets.CI_MASTER_ENCRYPTION_KEY || 'vXR9o6LX2YVy0aIYIvlq5tFyRp-kXHjnNzOm8o-mkYQ=' }}
          AUDIT_SIGNING_KEY: ci-audit-signing-key-not-for-production-at-all
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: clinomic_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
          CACHE_REDIS_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/0
          CHANNELS_REDIS_URL: redis://localhost:6379/2
          APP_ENV: testing
          DEBUG: "False"
        run: |
          cd backend_v3
          pytest --cov=apps --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=30 -x -q

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Run frontend tests
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          CI=true npm test -- --watchAll=false --passWithNoTests

  build:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend_v3
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Copy config files to server
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa"
          SERVER="deploy@${{ secrets.HOST_IP }}"
          ssh $SSH_OPTS $SERVER "sudo mkdir -p /opt/clinomic-b12-platform/ml/models /opt/clinomic-b12-platform/monitoring/grafana/provisioning && sudo chown -R deploy:deploy /opt/clinomic-b12-platform/monitoring"
          scp $SSH_OPTS docker-compose.prod.yml $SERVER:/opt/clinomic-b12-platform/docker-compose.prod.yml
          scp $SSH_OPTS nginx.prod.conf $SERVER:/opt/clinomic-b12-platform/nginx.prod.conf
          scp $SSH_OPTS -r backend_v3/ml/models/ $SERVER:/opt/clinomic-b12-platform/ml/
          scp $SSH_OPTS -r monitoring/ $SERVER:/opt/clinomic-b12-platform/monitoring/
      - name: Deploy to Production
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            deploy@${{ secrets.HOST_IP }} << 'EOF'

          set -e

          BACKEND_IMAGE="ghcr.io/dev-abiox/param"
          FRONTEND_IMAGE="ghcr.io/dev-abiox/param-frontend"
          BASE=/opt/clinomic-b12-platform
          COMPOSE="$BASE/docker-compose.prod.yml"

          echo "=== VALIDATING DEPLOYMENT ==="
          [ -f "$COMPOSE" ] || { echo "ERROR: $COMPOSE not found"; exit 1; }
          [ -f "$BASE/nginx.prod.conf" ] || { echo "ERROR: nginx.prod.conf not found"; exit 1; }

          echo "=== ENSURING SHARED DOCKER NETWORK ==="
          docker network create clinomic_network 2>/dev/null || true

          echo "=== SAVING CURRENT IMAGES FOR ROLLBACK ==="
          cd $BASE
          PREV_BACKEND=$(docker inspect --format='{{.Id}}' $BACKEND_IMAGE:latest 2>/dev/null || echo "")
          PREV_FRONTEND=$(docker inspect --format='{{.Id}}' $FRONTEND_IMAGE:latest 2>/dev/null || echo "")
          [ -n "$PREV_BACKEND" ] && docker tag $BACKEND_IMAGE:latest $BACKEND_IMAGE:previous || true
          [ -n "$PREV_FRONTEND" ] && docker tag $FRONTEND_IMAGE:latest $FRONTEND_IMAGE:previous || true

          echo "=== PULLING NEW IMAGES ==="
          docker-compose -f $COMPOSE pull

          echo "=== RECREATING CONTAINERS ==="
          docker-compose -f $COMPOSE up -d --force-recreate

          echo "=== WARMING UP SERVICES ==="
          sleep 30

          echo "=== HEALTH CHECK ==="
          if curl -f https://clinomiclabs.com/api/health/live; then
            echo "✓ Health check passed"
          else
            echo "✗ Health check failed — ROLLING BACK to previous images"
            [ -n "$PREV_BACKEND" ] && docker tag $BACKEND_IMAGE:previous $BACKEND_IMAGE:latest || true
            [ -n "$PREV_FRONTEND" ] && docker tag $FRONTEND_IMAGE:previous $FRONTEND_IMAGE:latest || true
            docker-compose -f $COMPOSE up -d --force-recreate
            echo "Rollback complete."
            exit 1
          fi

          echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY"

          EOF
