name: Production Deploy

on:
  push:
    branches: [ main, master ]

env:
  BACKEND_IMAGE: ghcr.io/dev-abiox/param
  FRONTEND_IMAGE: ghcr.io/dev-abiox/param-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: clinomic_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          cd backend_v3
          pip install setuptools
          pip install -r requirements.txt
      - name: Run backend tests with coverage
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          JWT_SECRET_KEY: ci-jwt-secret-key-not-for-production
          JWT_REFRESH_SECRET_KEY: ci-jwt-refresh-secret-not-for-production
          AUDIT_SIGNING_KEY: ci-audit-signing-key-not-for-production-at-all
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: clinomic_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
          CACHE_REDIS_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/0
          CHANNELS_REDIS_URL: redis://localhost:6379/2
          APP_ENV: testing
          DEBUG: "False"
        run: |
          cd backend_v3
          pytest --cov=apps --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=60 -x -q

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install scanning tools
        run: |
          pip install bandit pip-audit
      - name: Bandit SAST scan (Python)
        run: |
          cd backend_v3
          bandit -r apps/ -c pyproject.toml --severity-level medium -f txt || true
      - name: pip-audit (Python dependency vulnerabilities)
        run: |
          cd backend_v3
          # CVE ignores:
          #   PYSEC-2025-49 / CVE-2024-6345 — setuptools (pinned for razorpay SDK pkg_resources)
          #   PYSEC-2024-110                — scikit-learn (pinned for CatBoost model compatibility)
          #   CVE-2025-71176                — pytest (dev-only dependency, not reachable at runtime)
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2025-49 \
            --ignore-vuln CVE-2024-6345 \
            --ignore-vuln PYSEC-2024-110 \
            --ignore-vuln CVE-2025-71176
      - name: npm audit (JS dependency vulnerabilities)
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm audit --audit-level=high || true

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Run frontend tests
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          CI=true npm test -- --watchAll=false

  build:
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend_v3
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          trivyignores: backend_v3/.trivyignore
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          timeout: 10m

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa -H ${{ secrets.HOST_IP }} >> ~/.ssh/known_hosts
          # Server only supports ssh-rsa — configure client to accept it
          cat >> ~/.ssh/config << SSHEOF
          Host ${{ secrets.HOST_IP }}
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
          SSHEOF
      - name: Copy config files to server
        run: |
          SERVER="deploy@${{ secrets.HOST_IP }}"
          ssh $SERVER "mkdir -p /opt/clinomic-b12-platform/ml/models"
          # Remove old root-owned monitoring dir via docker, then recreate as deploy user
          ssh $SERVER 'docker run --rm -v /opt/clinomic-b12-platform:/host alpine rm -rf /host/monitoring'
          ssh $SERVER "mkdir -p /opt/clinomic-b12-platform/monitoring/grafana/provisioning/datasources /opt/clinomic-b12-platform/monitoring/grafana/provisioning/dashboards /opt/clinomic-b12-platform/monitoring/prometheus /opt/clinomic-b12-platform/monitoring/alertmanager"
          scp docker-compose.prod.yml $SERVER:/opt/clinomic-b12-platform/docker-compose.prod.yml
          scp nginx.prod.conf $SERVER:/opt/clinomic-b12-platform/nginx.prod.conf
          scp nginx.testing.conf $SERVER:/opt/clinomic-b12-platform/nginx.testing.conf
          scp -r backend_v3/ml/models/ $SERVER:/opt/clinomic-b12-platform/ml/
          scp monitoring/prometheus.yml $SERVER:/opt/clinomic-b12-platform/monitoring/prometheus.yml
          scp monitoring/prometheus/alerts.yml $SERVER:/opt/clinomic-b12-platform/monitoring/prometheus/alerts.yml
          scp -r monitoring/grafana/provisioning/ $SERVER:/opt/clinomic-b12-platform/monitoring/grafana/provisioning/
          scp monitoring/alertmanager/alertmanager.tmpl.yml $SERVER:/opt/clinomic-b12-platform/monitoring/alertmanager/alertmanager.tmpl.yml
          # Fix Grafana ownership (UID 472) and set secure permissions
          ssh $SERVER 'docker run --rm -v /opt/clinomic-b12-platform:/host alpine sh -c "chown -R 472:472 /host/monitoring/grafana && chmod -R 755 /host/monitoring"'
      - name: Deploy to Production
        run: |
          # Pass the git SHA as a positional arg so the remote script can
          # pin images to this specific build (instead of the mutable :latest).
          ssh deploy@${{ secrets.HOST_IP }} bash -s "${{ github.sha }}" << 'EOF'

          set -e

          DEPLOY_SHA="$1"
          export BACKEND_TAG="$DEPLOY_SHA"
          export FRONTEND_TAG="$DEPLOY_SHA"
          echo "=== Deploying SHA: $DEPLOY_SHA ==="

          BACKEND_IMAGE="ghcr.io/dev-abiox/param"
          FRONTEND_IMAGE="ghcr.io/dev-abiox/param-frontend"
          BASE=/opt/clinomic-b12-platform
          COMPOSE="$BASE/docker-compose.prod.yml"

          # Load server-side env vars (Razorpay keys, etc.) for docker-compose
          if [ -f "$BASE/.env" ]; then
            set -a
            source "$BASE/.env"
            set +a
            echo "✓ Loaded .env"
          else
            echo "⚠ No .env file found at $BASE/.env"
          fi

          echo "=== VALIDATING DEPLOYMENT ==="
          [ -f "$COMPOSE" ] || { echo "ERROR: $COMPOSE not found"; exit 1; }
          [ -f "$BASE/nginx.prod.conf" ] || { echo "ERROR: nginx.prod.conf not found"; exit 1; }

          echo "=== FREEING DISK SPACE ==="
          docker image prune -af --filter "until=72h" || true
          docker builder prune -af --filter "until=72h" || true
          docker volume prune -f --filter "label!=keep" || true
          echo "Disk usage after cleanup: $(df -h / | tail -1 | awk '{print $5}')"

          echo "=== ENSURING SHARED DOCKER NETWORK ==="
          docker network create clinomic_network 2>/dev/null || true

          echo "=== FIXING VOLUME PERMISSIONS ==="
          docker volume create static_volume 2>/dev/null || true
          docker run --rm -v static_volume:/data alpine chown -R 1000:1000 /data

          echo "=== SAVING CURRENT IMAGES FOR ROLLBACK ==="
          cd $BASE
          # Remember what tag was live BEFORE this deploy, so rollback can
          # re-pin the compose file to it exactly (not rely on a moving :latest).
          PREV_BACKEND_TAG=$(docker inspect --format='{{index .Config.Image}}' $(docker-compose -f $COMPOSE ps -q backend 2>/dev/null || echo "") 2>/dev/null | awk -F: '{print $NF}' || echo "latest")
          PREV_FRONTEND_TAG=$(docker inspect --format='{{index .Config.Image}}' $(docker-compose -f $COMPOSE ps -q frontend 2>/dev/null || echo "") 2>/dev/null | awk -F: '{print $NF}' || echo "latest")
          [ -z "$PREV_BACKEND_TAG" ] && PREV_BACKEND_TAG="latest"
          [ -z "$PREV_FRONTEND_TAG" ] && PREV_FRONTEND_TAG="latest"
          echo "Previous backend tag: $PREV_BACKEND_TAG"
          echo "Previous frontend tag: $PREV_FRONTEND_TAG"

          echo "=== PULLING NEW IMAGES (SHA $DEPLOY_SHA) ==="
          # Explicitly pull by SHA to avoid races with :latest being mutated
          docker pull $BACKEND_IMAGE:$DEPLOY_SHA
          docker pull $FRONTEND_IMAGE:$DEPLOY_SHA
          # Also update :latest to match so local `docker compose pull` still works
          docker tag $BACKEND_IMAGE:$DEPLOY_SHA $BACKEND_IMAGE:latest
          docker tag $FRONTEND_IMAGE:$DEPLOY_SHA $FRONTEND_IMAGE:latest

          echo "=== RECREATING CONTAINERS ==="
          # BACKEND_TAG/FRONTEND_TAG are already exported above to DEPLOY_SHA
          docker-compose -f $COMPOSE up -d --force-recreate

          echo "=== WARMING UP SERVICES ==="
          sleep 30

          echo "=== APPLYING DJANGO MIGRATIONS ==="
          BACKEND_CTR=$(docker-compose -f $COMPOSE ps -q backend)
          if [ -n "$BACKEND_CTR" ]; then
            # Fail fast on migration errors so rollback below picks up the
            # previous image instead of leaving a half-migrated DB live.
            if ! docker exec "$BACKEND_CTR" python manage.py migrate_schemas --shared --noinput; then
              echo "✗ shared migrations failed — ROLLING BACK to $PREV_BACKEND_TAG / $PREV_FRONTEND_TAG"
              export BACKEND_TAG="$PREV_BACKEND_TAG"
              export FRONTEND_TAG="$PREV_FRONTEND_TAG"
              docker-compose -f $COMPOSE up -d --force-recreate
              exit 1
            fi
            if ! docker exec "$BACKEND_CTR" python manage.py migrate_schemas --noinput; then
              echo "✗ tenant migrations failed — ROLLING BACK to $PREV_BACKEND_TAG / $PREV_FRONTEND_TAG"
              export BACKEND_TAG="$PREV_BACKEND_TAG"
              export FRONTEND_TAG="$PREV_FRONTEND_TAG"
              docker-compose -f $COMPOSE up -d --force-recreate
              exit 1
            fi
            echo "✓ Migrations applied"
          else
            echo "✗ No backend container found — aborting deploy"
            exit 1
          fi

          echo "=== HEALTH CHECK ==="
          if curl -f https://clinomiclabs.com/api/health/live; then
            echo "✓ Health check passed"
          else
            echo "✗ Health check failed — ROLLING BACK to $PREV_BACKEND_TAG / $PREV_FRONTEND_TAG"
            export BACKEND_TAG="$PREV_BACKEND_TAG"
            export FRONTEND_TAG="$PREV_FRONTEND_TAG"
            docker-compose -f $COMPOSE up -d --force-recreate
            echo "Rollback complete."
            exit 1
          fi

          echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY"

          EOF
