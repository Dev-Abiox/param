name: Testing Environment Deployment

on:
  push:
    branches: [ develop, staging, feature/** ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'develop'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/dev-abiox/param
  FRONTEND_IMAGE: ghcr.io/dev-abiox/param-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: clinomic_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install backend dependencies
      run: |
        cd backend_v3
        pip install setuptools
        pip install -r requirements.txt

    - name: Run backend tests with coverage
      env:
        DJANGO_SECRET_KEY: ci-secret-key-not-for-production
        JWT_SECRET_KEY: ci-jwt-secret-key-not-for-production
        JWT_REFRESH_SECRET_KEY: ci-jwt-refresh-secret-not-for-production
        MASTER_ENCRYPTION_KEY: ${{ secrets.CI_MASTER_ENCRYPTION_KEY || 'vXR9o6LX2YVy0aIYIvlq5tFyRp-kXHjnNzOm8o-mkYQ=' }}
        AUDIT_SIGNING_KEY: ci-audit-signing-key-not-for-production-at-all
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DB: clinomic_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        REDIS_URL: redis://localhost:6379/0
        CACHE_REDIS_URL: redis://localhost:6379/1
        CELERY_BROKER_URL: redis://localhost:6379/0
        CHANNELS_REDIS_URL: redis://localhost:6379/2
        APP_ENV: testing
        DEBUG: "False"
      run: |
        cd backend_v3
        pytest --cov=apps --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=30 -x -q

  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci --legacy-peer-deps

    - name: Run frontend tests
      run: |
        cd frontend
        CI=true npm test -- --watchAll=false --passWithNoTests

  build-test-images:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend_v3
        push: true
        tags: |
          ${{ env.BACKEND_IMAGE }}:test-latest
          ${{ env.BACKEND_IMAGE }}:test-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ env.FRONTEND_IMAGE }}:test-latest
          ${{ env.FRONTEND_IMAGE }}:test-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-to-testing:
    needs: build-test-images
    runs-on: ubuntu-latest

    environment: testing

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Copy config files to server
      run: |
        SSH_OPTS="-o StrictHostKeyChecking=no -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa"
        SERVER="deploy@${{ secrets.HOST_IP }}"
        BASE="/opt/clinomic-b12-platform"

        ssh $SSH_OPTS $SERVER "mkdir -p $BASE/ml/models"
        scp $SSH_OPTS docker-compose.prod.yml $SERVER:$BASE/docker-compose.prod.yml
        scp $SSH_OPTS docker-compose.testing.yml $SERVER:$BASE/docker-compose.testing.yml
        scp $SSH_OPTS nginx.testing.conf $SERVER:$BASE/nginx.testing.conf
        scp $SSH_OPTS nginx.prod.conf $SERVER:$BASE/nginx.prod.conf
        scp $SSH_OPTS -r backend_v3/ml/models/ $SERVER:$BASE/ml/

    - name: Deploy testing stack
      run: |
        ssh \
          -o StrictHostKeyChecking=no \
          -o HostKeyAlgorithms=+ssh-rsa \
          -o PubkeyAcceptedAlgorithms=+ssh-rsa \
          deploy@${{ secrets.HOST_IP }} << 'EOF'

        set -e

        BASE=/opt/clinomic-b12-platform

        echo "=== ENSURING SHARED DOCKER NETWORK ==="
        docker network create clinomic_network 2>/dev/null || true

        echo "=== ENSURING TESTING STATIC VOLUME ==="
        docker volume create static_testing_volume 2>/dev/null || true

        echo "=== PULLING NEW TEST IMAGES ==="
        cd $BASE
        docker-compose -f docker-compose.testing.yml pull

        echo "=== RESTARTING TESTING STACK ==="
        docker-compose -f docker-compose.testing.yml down || true
        docker-compose -f docker-compose.testing.yml up -d

        echo "=== RELOADING NGINX CONFIG ==="
        # nginx.testing.conf is bind-mounted into the container as /etc/nginx/nginx.conf
        # SCP already updated the file on the host — just signal nginx to reload it
        NGINX_CONTAINER=$(docker ps --filter 'name=nginx' --filter 'status=running' --format '{{.Names}}' | grep -v testing | head -1)
        if [ -n "$NGINX_CONTAINER" ]; then
          docker exec $NGINX_CONTAINER nginx -s reload
          echo "✓ nginx reloaded: $NGINX_CONTAINER"
        else
          echo "⚠ No running nginx container found — skipping reload"
        fi

        echo "=== WARMING UP SERVICES ==="
        sleep 30

        echo "=== HEALTH CHECK ==="
        if curl -f -H "Host: testing.clinomiclabs.com" https://localhost/api/health/live -k; then
          echo "✓ Testing health check passed"
        else
          echo "✗ Testing health check failed — showing logs"
          docker-compose -f docker-compose.testing.yml logs --tail=50 backend_testing
          exit 1
        fi

        echo "=== TESTING DEPLOYMENT COMPLETE ==="
        echo "URL: https://testing.clinomiclabs.com"

        EOF
