name: Testing Environment Deployment

on:
  push:
    branches: [ develop, staging, feature/** ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'develop'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/dev-abiox/param
  FRONTEND_IMAGE: ghcr.io/dev-abiox/param-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: clinomic_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install backend dependencies
      run: |
        cd backend_v3
        pip install setuptools
        pip install -r requirements.txt

    - name: Run backend tests with coverage
      env:
        DJANGO_SECRET_KEY: ci-secret-key-not-for-production
        JWT_SECRET_KEY: ci-jwt-secret-key-not-for-production
        JWT_REFRESH_SECRET_KEY: ci-jwt-refresh-secret-not-for-production
        AUDIT_SIGNING_KEY: ci-audit-signing-key-not-for-production-at-all
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DB: clinomic_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        REDIS_URL: redis://localhost:6379/0
        CACHE_REDIS_URL: redis://localhost:6379/1
        CELERY_BROKER_URL: redis://localhost:6379/0
        CHANNELS_REDIS_URL: redis://localhost:6379/2
        APP_ENV: testing
        DEBUG: "False"
      run: |
        cd backend_v3
        pytest --cov=apps --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=25 -x -q

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: Install scanning tools
      run: pip install bandit pip-audit
    - name: Bandit SAST scan (Python)
      run: |
        cd backend_v3
        bandit -r apps/ -c pyproject.toml --severity-level medium -f txt || true
    - name: pip-audit (Python dependency vulnerabilities)
      run: |
        cd backend_v3
        pip-audit -r requirements.txt --ignore-vuln PYSEC-2025-49 --ignore-vuln CVE-2024-6345 --ignore-vuln PYSEC-2024-110
    - name: npm audit (JS dependency vulnerabilities)
      run: |
        cd frontend
        npm ci --legacy-peer-deps
        npm audit --audit-level=high || true

  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci --legacy-peer-deps

    - name: Run frontend tests
      run: |
        cd frontend
        CI=true npm test -- --watchAll=false

  build-test-images:
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend_v3
        push: true
        tags: |
          ${{ env.BACKEND_IMAGE }}:test-latest
          ${{ env.BACKEND_IMAGE }}:test-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ env.FRONTEND_IMAGE }}:test-latest
          ${{ env.FRONTEND_IMAGE }}:test-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-to-testing:
    needs: build-test-images
    runs-on: ubuntu-latest

    environment: testing

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -t rsa -H ${{ secrets.HOST_IP }} >> ~/.ssh/known_hosts
        # Server only supports ssh-rsa — configure client to accept it
        cat >> ~/.ssh/config << SSHEOF
        Host ${{ secrets.HOST_IP }}
          HostKeyAlgorithms +ssh-rsa
          PubkeyAcceptedAlgorithms +ssh-rsa
        SSHEOF

    - name: Copy config files to server
      run: |
        SERVER="deploy@${{ secrets.HOST_IP }}"
        BASE="/opt/clinomic-b12-platform"

        ssh $SERVER "mkdir -p $BASE/ml/models"
        scp docker-compose.prod.yml $SERVER:$BASE/docker-compose.prod.yml
        scp docker-compose.testing.yml $SERVER:$BASE/docker-compose.testing.yml
        scp nginx.testing.conf $SERVER:$BASE/nginx.testing.conf
        scp nginx.prod.conf $SERVER:$BASE/nginx.prod.conf
        scp -r backend_v3/ml/models/ $SERVER:$BASE/ml/

    - name: Deploy testing stack
      run: |
        ssh deploy@${{ secrets.HOST_IP }} << 'EOF'

        set -e

        BASE=/opt/clinomic-b12-platform

        # Load server-side env vars for docker-compose
        if [ -f "$BASE/.env" ]; then
          set -a
          source "$BASE/.env"
          set +a
          echo "✓ Loaded .env"
        else
          echo "⚠ No .env file found at $BASE/.env"
        fi

        echo "=== FREEING DISK SPACE ==="
        docker image prune -af --filter "until=72h" || true
        docker builder prune -af --filter "until=72h" || true
        docker volume prune -f --filter "label!=keep" || true
        echo "Disk usage after cleanup: $(df -h / | tail -1 | awk '{print $5}')"

        echo "=== ENSURING SHARED DOCKER NETWORK ==="
        docker network create clinomic_network 2>/dev/null || true

        echo "=== ENSURING TESTING STATIC VOLUME ==="
        docker volume create static_testing_volume 2>/dev/null || true

        echo "=== PULLING NEW TEST IMAGES ==="
        cd $BASE
        docker-compose -f docker-compose.testing.yml pull

        echo "=== RESTARTING TESTING STACK ==="
        docker-compose -f docker-compose.testing.yml down || true
        docker-compose -f docker-compose.testing.yml up -d

        echo "=== RELOADING NGINX CONFIG ==="
        # nginx.testing.conf is bind-mounted into the container as /etc/nginx/nginx.conf
        # SCP already updated the file on the host — just signal nginx to reload it
        NGINX_CONTAINER=$(docker ps --filter 'name=nginx' --filter 'status=running' --format '{{.Names}}' | grep -v testing | head -1)
        if [ -n "$NGINX_CONTAINER" ]; then
          docker exec $NGINX_CONTAINER nginx -s reload
          echo "✓ nginx reloaded: $NGINX_CONTAINER"
        else
          echo "⚠ No running nginx container found — skipping reload"
        fi

        echo "=== WARMING UP SERVICES ==="
        sleep 30

        echo "=== HEALTH CHECK ==="
        BACKEND_CONTAINER=$(docker-compose -f docker-compose.testing.yml ps -q backend_testing)
        if [ -n "$BACKEND_CONTAINER" ] && docker exec "$BACKEND_CONTAINER" curl -f -H 'Host: testing.clinomiclabs.com' -H 'X-Forwarded-Proto: https' http://localhost:8000/api/health/live; then
          echo "✓ Testing health check passed"
        else
          echo "✗ Testing health check failed — showing logs"
          docker-compose -f docker-compose.testing.yml logs --tail=50 backend_testing
          exit 1
        fi

        echo "=== TESTING DEPLOYMENT COMPLETE ==="
        echo "URL: https://testing.clinomiclabs.com"

        EOF
