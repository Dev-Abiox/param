events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=2r/s;

    # gzip for text assets. Off for images/binaries (already compressed) and
    # not applied to anything under /api/ to avoid BREACH-class risks on
    # authenticated JSON.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream uptime_kuma {
        server uptime-kuma:3001;
    }

    # WebSocket upgrade map — used by /grafana/api/live/ and any other
    # location that needs to pass through a Connection: upgrade header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "0";  # Disabled — CSP provides better XSS protection; X-XSS-Protection can cause vulnerabilities in older browsers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://unpkg.com https://cdnjs.cloudflare.com; worker-src 'self' blob: https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https://api.razorpay.com; frame-src https://checkout.razorpay.com https://api.razorpay.com; frame-ancestors 'none';";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=()";
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "credentialless";

    server {
        listen 80;
        
        # Health check endpoint - no redirect
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Everything else redirects to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        client_max_body_size 100M;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Serve Django static files, fallback to frontend for React assets
        location /static/ {
            alias /app/staticfiles/;
            try_files $uri @frontend_static;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location @frontend_static {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            # Disable gzip on authenticated JSON to avoid BREACH-style attacks.
            gzip off;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket — Django Channels (ASGI)
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Django admin & backend (rate-limited)
        location /admin/ {
            limit_req zone=admin_limit burst=5 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Media uploads
        location /media/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prometheus metrics — internal only. Exact match so /metrics/foo
        # can't sneak past the ACL, and deny runs before proxy_pass.
        location = /metrics {
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uptime Kuma — status page + uptime monitoring dashboard.
        location /status/ {
            proxy_pass http://uptime_kuma/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            add_header X-Clinomic-Proxy "uptime-kuma" always;
        }

        # Grafana — proxied behind admin auth. Grafana handles the /grafana/
        # sub-path itself via GF_SERVER_SERVE_FROM_SUB_PATH=true, so no rewrite
        # is needed. WebSocket upgrade is required for Grafana Live.
        location /grafana/ {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Grafana ships its own CSP and X-Frame-Options. Our global
            # add_header directives are tuned for the clinomic SPA and will
            # block Grafana's inline scripts. In nginx, adding ANY add_header
            # at the location level drops ALL inherited add_headers — so we
            # set a single sentinel header here to let Grafana's own security
            # headers pass through from upstream.
            add_header X-Clinomic-Proxy "grafana" always;
        }

        # Block hidden files
        location ~ /\. {
            deny all;
            return 404;
        }

        # Block sensitive extensions
        location ~* \.(env|log|ini|conf|sql|bak)$ {
            deny all;
            return 404;
        }

        # Frontend SPA
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}